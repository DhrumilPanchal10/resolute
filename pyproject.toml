[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolute"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.0",
    "fastmcp>=2.0",
    "litellm>=1.50",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "pgvector>=0.3",
    "redis>=5.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Heavy ML deps for retrieval phase (Phase 3+); not needed for scaffold tests
ml = [
    "sentence-transformers>=3.0",
    "bm25s>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore", "src/resolute"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "fakeredis>=2.40.0",
]
