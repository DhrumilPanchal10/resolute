# Action Scenarios for Resolute Evaluation
# 100 scenarios across billing, auth, performance, config, and other categories.
# Each scenario specifies ticket text, expected triage, expected actions, and reply checks.

# =============================================================================
# BILLING — 30 scenarios
# =============================================================================

- id: billing-001
  title: Duplicate charge on Pro plan
  category: billing
  severity: high
  ticket_text: "I was charged twice for my Pro plan last month. Invoice INV-2024-001 shows $199 but I see two charges."
  expected:
    triage_category: billing
    triage_severity: high
    reply_contains: ["refund", "duplicate"]
    actions:
      - action_type: refund_invoice
        should_occur: true
  tags: [happy_path, refund]

