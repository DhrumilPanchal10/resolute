services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resolute
      POSTGRES_PASSWORD: resolute
      POSTGRES_DB: resolute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
