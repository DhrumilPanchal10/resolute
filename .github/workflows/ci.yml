name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check src/
          uv run ruff format --check src/
          uv run mypy src/

      - name: Test
        run: uv run pytest

      - name: Eval gate
        run: uv run python evals/report.py
